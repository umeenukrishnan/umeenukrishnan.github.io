<svg class="fig" viewBox="0 0 260 340" role="img"
     aria-label="Collectible-style miniature of Meenu holding a glowing fracture orb">
  <defs>
    <radialGradient id="figGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d8edff" />
      <stop offset="40%"  stop-color="#55a0da" stop-opacity=".75" />
      <stop offset="100%" stop-color="#1c4877" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="figOrb" cx="38%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="45%"  stop-color="#7cc0f0" />
      <stop offset="100%" stop-color="#1c4877" />
    </radialGradient>
    <linearGradient id="figSkin" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0%"   stop-color="#f2c9a6" />
      <stop offset="60%"  stop-color="#dba87d" />
      <stop offset="100%" stop-color="#b87f58" />
    </linearGradient>
    <linearGradient id="figHair" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0%"   stop-color="#393144" />
      <stop offset="55%"  stop-color="#1b1725" />
      <stop offset="100%" stop-color="#0a0810" />
    </linearGradient>
    <linearGradient id="figCoat" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0%"   stop-color="#e2cfb4" />
      <stop offset="55%"  stop-color="#bda584" />
      <stop offset="100%" stop-color="#8d7659" />
    </linearGradient>
    <linearGradient id="figTop" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0%"   stop-color="#334566" />
      <stop offset="60%"  stop-color="#1b2740" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="figBaseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2d568c" />
      <stop offset="100%" stop-color="#15375f" />
    </linearGradient>
    <linearGradient id="figBaseSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#122f54" />
      <stop offset="100%" stop-color="#050f1f" />
    </linearGradient>
  </defs>

  <!-- ── plinth ─────────────────────────────────────────────────── -->
  <ellipse cx="130" cy="316" rx="84" ry="15" fill="#0b1b33" opacity=".22" />
  <path d="M58 296 L58 310 A72 17 0 0 0 202 310 L202 296 Z" fill="url(#figBaseSide)" />
  <ellipse cx="130" cy="296" rx="72" ry="17" fill="url(#figBaseTop)" />
  <ellipse cx="130" cy="295" rx="58" ry="12" fill="#0e2748" opacity=".55" />

  <!-- ── figure ─────────────────────────────────────────────────── -->
  <g class="fig-figure">
    <!-- blazer tails behind -->
    <path d="M96 186 q-26 44 -14 100 l30 -5 q-12 -48 0 -92 Z" fill="url(#figCoat)" opacity=".9" />
    <path d="M164 186 q26 44 14 100 l-30 -5 q12 -48 0 -92 Z" fill="url(#figCoat)" opacity=".9" />

    <!-- legs + shoes -->
    <rect x="103" y="236" width="23" height="58" rx="11.5" fill="url(#figTop)" />
    <rect x="134" y="236" width="23" height="58" rx="11.5" fill="url(#figTop)" />
    <ellipse cx="114" cy="292" rx="16" ry="8" fill="#0d1526" />
    <ellipse cx="146" cy="292" rx="16" ry="8" fill="#0d1526" />

    <!-- torso -->
    <path d="M130 158 q-35 3 -39 32 l-4 54 q0 11 11 11 h64 q11 0 11 -11 l-4 -54 q-4 -29 -39 -32 Z"
          fill="url(#figTop)" />
    <!-- open blazer front -->
    <path d="M95 190 q-7 30 -5 62 l21 2 q-5 -37 7 -67 Z" fill="url(#figCoat)" />
    <path d="M165 190 q7 30 5 62 l-21 2 q5 -37 -7 -67 Z" fill="url(#figCoat)" />

    <!-- right arm, resting -->
    <path d="M168 186 q18 11 18 36 t-7 33 l-17 -5 q7 -27 0 -50 Z" fill="url(#figCoat)" />
    <circle cx="172" cy="256" r="10.5" fill="url(#figSkin)" />

    <!-- head -->
    <g class="fig-hair-back" fill="url(#figHair)">
      <circle cx="92"  cy="94"  r="27" />
      <circle cx="168" cy="94"  r="27" />
      <circle cx="105" cy="68"  r="26" />
      <circle cx="155" cy="68"  r="26" />
      <circle cx="130" cy="58"  r="29" />
      <circle cx="81"  cy="122" r="22" />
      <circle cx="179" cy="122" r="22" />
      <circle cx="86"  cy="148" r="18" />
      <circle cx="174" cy="148" r="18" />
    </g>

    <ellipse cx="130" cy="114" rx="46" ry="48" fill="url(#figSkin)" />

    <!-- fringe -->
    <g fill="url(#figHair)">
      <circle cx="103" cy="78" r="21" />
      <circle cx="130" cy="70" r="23" />
      <circle cx="157" cy="78" r="21" />
    </g>

    <!-- face -->
    <circle cx="130" cy="98"  r="3"   fill="#8f2f4a" />
    <ellipse cx="113" cy="120" rx="4.4" ry="5.6" fill="#17121c" />
    <ellipse cx="147" cy="120" rx="4.4" ry="5.6" fill="#17121c" />
    <circle  cx="114.6" cy="118" r="1.5" fill="#fff" opacity=".9" />
    <circle  cx="148.6" cy="118" r="1.5" fill="#fff" opacity=".9" />
    <ellipse cx="104" cy="133" rx="8" ry="5" fill="#e08a86" opacity=".3" />
    <ellipse cx="156" cy="133" rx="8" ry="5" fill="#e08a86" opacity=".3" />
    <path d="M119 137 q11 10 22 0" stroke="#2a1f27" stroke-width="2.6"
          fill="none" stroke-linecap="round" />

    <!-- rim light down the lit side -->
    <path d="M88 100 q-7 22 -3 44" stroke="#ffffff" stroke-width="3"
          fill="none" stroke-linecap="round" opacity=".3" />
    <path d="M92 196 q-6 26 -3 50" stroke="#ffffff" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity=".18" />

    <!-- left arm, raised, drawn over the curls so it reads clearly -->
    <path d="M97 196 q-14 -14 -24 -30 q-4 -7 4 -12 t13 1 q8 14 19 23 Z" fill="url(#figCoat)" />
    <path d="M97 196 q-14 -14 -24 -30" stroke="#8d7659" stroke-width="1.6"
          fill="none" opacity=".35" stroke-linecap="round" />
    <circle cx="69" cy="155" r="11.5" fill="url(#figSkin)" />

    <!-- the glowing fracture orb -->
    <g class="fig-orb">
      <circle cx="56" cy="138" r="40" fill="url(#figGlow)" />
      <circle cx="56" cy="138" r="19" fill="url(#figOrb)" />
      <path d="M48 126 l7 11 l-7 6 l11 8 l-4 9" stroke="#ffffff" stroke-width="2"
            fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".9" />
    </g>
  </g>
</svg>
